<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="darkreader-lock">
    <meta name="color-scheme" content="dark">

    <link rel="icon" type="image/webp" href="/src/assets/icons/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SINGGAH | Inovasi Digital Teknik Elektro Poliban</title>
    <script>
      try {
        if (localStorage.getItem("singgah-theme") !== "dark") {
          document.documentElement.classList.add("light")
        }
      } catch (e) {}
    </script>
    <style>
      @keyframes singgah-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #singgah-splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #0b1220;
      }
      .splash-title {
        font-size: 1.875rem;
        font-weight: 800;
        letter-spacing: 0.025em;
        color: #7dd3fc;
      }
      .splash-spinner {
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        border: 2px solid transparent;
        border-top-color: #22d3ee;
        border-right-color: rgba(34, 211, 238, 0.5);
        animation: singgah-spin 1.2s linear infinite;
      }
      html.light #singgah-splash {
        background: #f3f5f8;
      }
      html.light .splash-title {
        color: #1b2a4a;
      }
      html.light .splash-spinner {
        border-top-color: #0284c7;
        border-right-color: rgba(2, 132, 199, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="singgah-splash">
        <div class="splash-title">SINGGAH</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
