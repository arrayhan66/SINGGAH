server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API diteruskan ke service `api` (docker-compose) / localhost:5000.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # index.html tidak boleh di-cache, agar selalu menarik bundle terbaru
    # (hash file berubah tiap build => mencegah bundle lama yang buggy tertimpa).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Asset ber-hash (index-*.js, index-*.css, dsb.) bersifat immutable -> cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: semua route lain ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}