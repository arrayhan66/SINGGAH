server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API diteruskan ke service `api` (docker-compose) / localhost:5000.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # index.html tidak boleh di-cache, agar selalu menarik bundle terbaru
    # (hash file berubah tiap build => mencegah bundle lama yang buggy tertimpa).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Asset ber-hash (index-*.js, index-*.css, dsb.) bersifat immutable -> cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: semua route lain ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== Kompresi =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Brotli (jika modul tersedia) jauh lebih kecil dari gzip untuk teks.
    # Aktifkan bila mod di image nginx:load_module modules/ngx_http_brotli_filter_module.so;
