# Konfigurasi nginx untuk API Singgah.
#
# Dipasang di: /etc/nginx/sites-available/singgah
# Diaktifkan:  ln -s /etc/nginx/sites-available/singgah /etc/nginx/sites-enabled/
# Diuji:       nginx -t && systemctl reload nginx
#
# Rantai request di produksi:
#   browser -> Vercel (rewrite /api) -> nginx (port 443) -> Node (127.0.0.1:5000)

# Batas rate limit di nginx. 10m = 10 MB RAM, cukup untuk +/-160.000 IP unik.
# Longgar dengan sengaja supaya 1000 orang yang datang bersamaan tidak ikut
# ter-throttle. Nginx ini tasked-nya menahan satu IP yang menyerang, bukan
# membatasi 1000 pengguna sah. Batas tulis yang ketat tetap ditangani aplikasi
# (rate limiter hanya-write di server.js), jadi tidak perlu diulang di sini.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

# Keep-alive ke Node: 1000 koneksi aktif yang lalu-menempel ke worker yang sama
# jauh lebih murah daripada membuka 1000 socket baru tiap detik.
upstream singgah_api {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 128;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ---- Port 80: hanya untuk penerbitan sertifikat + redirect ke HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name api.singgah.site;

    # Certbot menulis berkas verifikasi di sini, jadi /.well-known tidak boleh
    # ikut di-redirect ke HTTPS (nanti certbot tidak bisa membaca jawabannya).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Port 443: HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.singgah.site;

    # Ganti dengan path hasil `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/api.singgah.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.singgah.site/privkey.pem;

    # --- PENTING:kenali IP asli sebelum rate limit ---
    # Request datang dari Vercel, bukan langsung dari browser. Tanpa baris di
    # bawah, $remote_addr = IP edge Vercel, semua user terlihat satu IP, dan
    # zone rate limit di atas akan men-throttle 1000 orang seolah satu penyerang.
    # Vercel meneruskan IP asli lewat X-Forwarded-For.
    set_real_ip_from 76.76.21.0/24;   # Vercel (perbarui bila perlu)
    set_real_ip_from 2606:4700::/32;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # HSTS: paksa browser memakai HTTPS selama 1 tahun.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Naikkan batas body supaya upload video/berita besar tidak ditolak 413.
    client_max_body_size 25m;

    # Semua API lewat satu aturan. Tidak dipisah per endpoint: memisah dengan
    # location ~ hanya mencocokkan path, bukan method -- sehingga POST (tulis)
    # ikut dapat limit longgar yang dimaksud untuk GET (baca).
    location / {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://singgah_api;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
