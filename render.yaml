# Blueprint Render.com untuk SINGGAH
#
# Satu web service (Docker) yang melayani API Express DAN build frontend
# dari client/dist — frontend & API satu origin, jadi tidak perlu CORS
# untuk pakai domain sendiri.
#
# Cara pakai:
#   1. Push file ini ke GitHub (branch main).
#   2. Render Dashboard -> New -> Blueprint -> pilih repo ini.
#      (Render membaca render.yaml otomatis, tidak perlu isi manual)
#   3. Env var yang marked "sync: false" (rahasia) TETAP harus diisi
#      manual di dashboard Render.
#
# Free tier: 512 MB RAM, 0.1 CPU, service tidur setelah 15 menit idle.

services:
  - type: web
    name: singgah
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    # Render mengirim PORT sendiri; JANGAN set PORT di sini.
    envVars:
      - key: NODE_ENV
        value: production

      # Render memakai reverse proxy di depan app -> trust proxy = 1.
      - key: TRUST_PROXY
        value: "1"

      # Free tier hanya 0.1 CPU. Jangan pakai cluster PM2 multi-worker
      # karena limiter/rate-limit jadi longgar. 1 worker saja.
      - key: PM2_INSTANCES
        value: "1"

      # Dibaca saat build image (ARG di Dockerfile).
      - key: VITE_API_URL
        value: /api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

      # --- Rahasia: isi manual di dashboard Render ---
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Free tier 512 MB RAM -> pool kecil biar tidak makan memori.
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_ACQUIRE
        value: "10000"
      - key: DB_POOL_IDLE
        value: "10000"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Redis opsional. Kalau dikosongkan, app pakai cache memori
      # (harus PM2_INSTANCES=1, sudah di-set di atas).
      - key: REDIS_URL
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: SENDLIB_API_KEY
        sync: false
      - key: SENDLIB_FROM_EMAIL
        sync: false

      # Origin frontend yang diizinkan oleh CORS. Railway (lama) +
      # domain Vercel. Ganti dengan domain final kalau sudah pindah.
      - key: FRONTEND_URL
        sync: false
