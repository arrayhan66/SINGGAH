openapi: 3.0.3

info:
  title: SINGGAH API
  version: 1.0.0
  description: REST API SINGGAH

servers:
  - url: http://localhost:5000/api

paths:
  /auth/login:
    $ref: './paths/auth.yaml#/login'

  /auth/register:
    $ref: './paths/auth.yaml#/register'

  /auth/verify-email:
    $ref: './paths/auth.yaml#/verifyEmail'

  /auth/resend-verification:
    $ref: './paths/auth.yaml#/resendVerification'

  /auth/forgot-password:
    $ref: './paths/auth.yaml#/forgotPassword'

  /auth/verify-reset-code:
    $ref: './paths/auth.yaml#/verifyResetCode'

  /auth/reset-password:
    $ref: './paths/auth.yaml#/resetPassword'

  /auth/change-password:
    $ref: './paths/auth.yaml#/changePassword'

  /auth/me:
    $ref: './paths/interactions.yaml#/me'

  /auth/profile-stats:
    $ref: './paths/interactions.yaml#/profileStats'

  /auth/profile:
    $ref: './paths/interactions.yaml#/updateProfile'

  /auth/account:
    $ref: './paths/interactions.yaml#/deleteAccount'

  /users:
    $ref: './paths/users.yaml#/collection'

  /users/{id}:
    $ref: './paths/users.yaml#/single'

  /categories:
    $ref: './paths/categories.yaml#/collection'

  /categories/{id}:
    $ref: './paths/categories.yaml#/single'

  /projects:
    $ref: './paths/projects.yaml#/collection'

  /projects/{id}:
    $ref: './paths/projects.yaml#/single'

  /projects/pending:
    $ref: './paths/interactions.yaml#/pending'

  /projects/{id}/status:
    $ref: './paths/interactions.yaml#/updateProjectStatus'

  /projects/{id}/comments:
    get:
      $ref: './paths/interactions.yaml#/getComments'
    post:
      $ref: './paths/interactions.yaml#/addComment'

  /projects/{id}/comments/{commentId}:
    put:
      $ref: './paths/interactions.yaml#/updateComment'
    delete:
      $ref: './paths/interactions.yaml#/removeComment'

  /projects/{id}/comments/{commentId}/replies:
    get:
      $ref: './paths/interactions.yaml#/getReplies'
    post:
      $ref: './paths/interactions.yaml#/addReply'

  /projects/{id}/comments/{commentId}/replies/{replyId}:
    put:
      $ref: './paths/interactions.yaml#/updateReply'
    delete:
      $ref: './paths/interactions.yaml#/removeReply'

  /projects/{id}/likes:
    get:
      $ref: './paths/interactions.yaml#/getLikes'

  /projects/{id}/like:
    post:
      $ref: './paths/interactions.yaml#/toggleLike'

  /projects/{id}/view:
    post:
      $ref: './paths/interactions.yaml#/addView'

  /projects/{id}/bookmark:
    post:
      $ref: './paths/interactions.yaml#/toggleBookmark'

  /projects/my-bookmarks:
    get:
      $ref: './paths/interactions.yaml#/myBookmarks'

  /projects/{id}/videos:
    get:
      $ref: './paths/interactions.yaml#/getVideos'
    post:
      $ref: './paths/interactions.yaml#/addVideo'

  /projects/{id}/videos/{videoId}:
    delete:
      $ref: './paths/interactions.yaml#/removeVideo'

  /projects/{id}/documents:
    get:
      $ref: './paths/interactions.yaml#/getDocuments'
    post:
      $ref: './paths/interactions.yaml#/addDocument'

  /projects/{id}/documents/{docId}:
    delete:
      $ref: './paths/interactions.yaml#/removeDocument'

  /projects/{id}/links:
    get:
      $ref: './paths/interactions.yaml#/getLinks'
    post:
      $ref: './paths/interactions.yaml#/addLink'

  /projects/{id}/links/{linkId}:
    delete:
      $ref: './paths/interactions.yaml#/removeLink'

  /projects/{id}/members:
    get:
      $ref: './paths/interactions.yaml#/getMembers'
    post:
      $ref: './paths/interactions.yaml#/addMember'

  /projects/{id}/members/{memberId}:
    delete:
      $ref: './paths/interactions.yaml#/removeMember'

  /projects/{id}/images:
    get:
      $ref: './paths/interactions.yaml#/getImages'
    post:
      $ref: './paths/interactions.yaml#/addImage'

  /projects/{id}/images/{imageId}:
    delete:
      $ref: './paths/interactions.yaml#/removeImage'

  /stats:
    get:
      $ref: './paths/interactions.yaml#/stats'

  /hall:
    get:
      $ref: './paths/hall.yaml#/overview'

  /news:
    $ref: './paths/news.yaml#/collection'

  /news/{id}:
    $ref: './paths/news.yaml#/single'

  /dashboard:
    $ref: './paths/dashboard.yaml#/summary'

  /notifications:
    $ref: './paths/notifications.yaml#/collection'

  /notifications/read-all:
    $ref: './paths/notifications.yaml#/markAllRead'

  /notifications/bulk:
    post:
      $ref: './paths/notifications.yaml#/bulkUpdate'
    delete:
      $ref: './paths/notifications.yaml#/bulkDelete'

  /notifications/all:
    $ref: './paths/notifications.yaml#/deleteAll'

  /notifications/announcements:
    $ref: './paths/notifications.yaml#/announcements'

  /notifications/{id}:
    $ref: './paths/notifications.yaml#/deleteOne'

  /notifications/{id}/read:
    $ref: './paths/notifications.yaml#/markOneRead'

  /notifications/{id}/unread:
    $ref: './paths/notifications.yaml#/markOneUnread'

  /activity-logs:
    get:
      $ref: './paths/system.yaml#/activityLogs'

  /settings:
    get:
      $ref: './paths/system.yaml#/settings'
    put:
      $ref: './paths/system.yaml#/settings'

  /reports:
    get:
      $ref: './paths/system.yaml#/reports'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
