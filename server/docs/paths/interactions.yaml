me:
  get:
    tags:
      - Authentication
    summary: Ambil data user yang sedang login
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Berhasil mengambil data user
      "401":
        description: Token tidak valid atau tidak ada

profileStats:
  get:
    tags:
      - Authentication
    summary: Statistik project milik user yang sedang login
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Berhasil
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    published:
                      type: integer
                      example: 2
                    pending:
                      type: integer
                      example: 1
                    rejected:
                      type: integer
                      example: 0
                    total:
                      type: integer
                      example: 3

updateProfile:
  put:
    tags:
      - Authentication
    summary: Perbarui profil user yang sedang login
    description: |
      Mengubah data profil. Upload avatar (multipart, field "avatar") bersifat opsional.
    security:
      - BearerAuth: []
    requestBody:
      required: false
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              name:
                type: string
                example: Ilham
              username:
                type: string
                example: ilhambb666
              email:
                type: string
                example: ilhambb666@gmail.com
              nim_nip:
                type: string
                example: "2023001"
              avatar:
                type: string
                format: binary
    responses:
      "200":
        description: Profil berhasil diperbarui
      "400":
        description: Email atau username sudah digunakan
      "404":
        description: User tidak ditemukan

deleteAccount:
  delete:
    tags:
      - Authentication
    summary: Hapus akun sendiri
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - password
            properties:
              password:
                type: string
                example: password123
    responses:
      "200":
        description: Akun berhasil dihapus
      "400":
        description: Password salah, atau tidak dapat menghapus admin terakhir
      "404":
        description: User tidak ditemukan

pending:
  get:
    tags:
      - Projects
    summary: Ambil daftar project pending (admin)
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Berhasil mengambil daftar project pending
      "403":
        description: Hanya admin

updateProjectStatus:
  patch:
    tags:
      - Projects
    summary: Ubah status project (admin)
    description: |
      Mengubah status project menjadi pending, published, atau rejected.
      Pemilik project otomatis menerima notifikasi.
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                example: published
    responses:
      "200":
        description: Status project berhasil diperbarui
      "400":
        description: Status tidak valid
      "404":
        description: Project tidak ditemukan

